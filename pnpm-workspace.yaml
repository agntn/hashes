packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# One version per name for the library and docs/, whose /mcp route runs the library's MCP code.
catalogs:
  deps:
    "@agntn/tools": 0.2.4
    "@modelcontextprotocol/sdk": 1.32.2
    "@modelcontextprotocol/server": 2.4.0
    "@nuxtjs/mcp-toolkit": 0.24.2
    "@vueuse/core": 15.0.0
    agents: 0.30.1
    better-sqlite3: 12.11.1
    docus: 5.15.0
    nuxt: 4.6.2
    ufo: 1.6.4
    zod: 4.6.7
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.0.4
    "@iconify-json/lucide": 1.2.147
    "@iconify-json/simple-icons": 1.2.100
    "@iconify-json/token": 1.2.42
    "@iconify-json/vscode-icons": 1.2.92
    "@modelcontextprotocol/client": 2.4.0
    "@nuxt/content": 3.16.2
    "@nuxt/ui": 4.12.0
    "@oh-my-pi/omptype": 18.4.12
    "@oh-my-pi/pi-coding-agent": 18.4.12
    "@types/node": 26.6.5
    ai: 7.0.153
    esbuild: 0.28.2
    obuild: 0.4.45
    oxlint-tsgolint: 7.0.2005
    shiki: 4.5.0
    typebox: 1.4.3
    typescript: 7.0.2
    vue-tsc: 3.3.13
    wrangler: 4.152.0
  # vue-tsc and Nuxt's type generation still need the TypeScript 5 API, which 7 no longer ships.
  nuxt:
    typescript: 5.9.3

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@oh-my-pi/omp-stats@18.4.2"
  - "@oh-my-pi/omptype@18.4.2"
  - "@oh-my-pi/pi-agent-core@18.4.2"
  - "@oh-my-pi/pi-ai@18.4.2"
  - "@oh-my-pi/pi-catalog@18.4.2"
  - "@oh-my-pi/pi-coding-agent@18.4.2"
  - "@oh-my-pi/pi-mnemopi@18.4.2"
  - "@oh-my-pi/pi-natives-darwin-arm64@18.4.2"
  - "@oh-my-pi/pi-natives-darwin-x64@18.4.2"
  - "@oh-my-pi/pi-natives-linux-arm64@18.4.2"
  - "@oh-my-pi/pi-natives-linux-x64@18.4.2"
  - "@oh-my-pi/pi-natives-win32-arm64@18.4.2"
  - "@oh-my-pi/pi-natives-win32-x64@18.4.2"
  - "@oh-my-pi/pi-natives@18.4.2"
  - "@oh-my-pi/pi-tui@18.4.2"
  - "@oh-my-pi/pi-utils@18.4.2"
  - "@oh-my-pi/pi-wire@18.4.2"
  - "@oh-my-pi/snapcompact@18.4.2"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
  - obuild@0.4.43
  - "@agntn/*"
